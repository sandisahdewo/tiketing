name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      # Without makensis, wails build -nsis silently skips the installer.
      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Tes
        run: scripts/ci-test.sh

      - name: Siapkan versi
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # actions/checkout leaves the tag without its message; fetch it.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "::error title=Tag tanpa pesan::Buat tag dengan git tag -a $TAG -m \"catatan rilis\""
            exit 1
          fi
          NOTES="$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" | sed '/^-----BEGIN/,$d')"
          MANDATORY=false
          if echo "$NOTES" | grep -qi '\[wajib\]'; then MANDATORY=true; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "mandatory=$MANDATORY" >> "$GITHUB_OUTPUT"
          printf '%s' "$NOTES" | sed 's/\[wajib\]//Ig' > release-notes.txt
          node -e "const f='wails.json';const c=require('./'+f);c.info.productVersion='$VERSION';require('fs').writeFileSync(f,JSON.stringify(c,null,2)+'\n')"

      - name: Build
        run: |
          wails build -platform windows/amd64 -nsis -clean \
            -ldflags "-X main.appVersion=${{ steps.meta.outputs.version }} -X tiket/internal/updater.ReleasesURL=https://github.com/${GITHUB_REPOSITORY}/releases"

      - name: Tanda tangani & buat latest.json
        env:
          TIKET_SIGNING_KEY: ${{ secrets.TIKET_SIGNING_KEY }}
        run: |
          go run ./cmd/tiket-release manifest \
            -file build/bin/tiket.exe \
            -version "${{ steps.meta.outputs.tag }}" \
            -url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.meta.outputs.tag }}/tiket.exe" \
            -notes "$(cat release-notes.txt)" \
            -mandatory=${{ steps.meta.outputs.mandatory }} \
            -out build/bin/latest.json

      - name: Terbitkan rilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la build/bin
          if ! out=$(gh release create "${{ steps.meta.outputs.tag }}" \
            build/bin/tiket.exe \
            build/bin/*-installer.exe \
            build/bin/latest.json \
            --title "${{ steps.meta.outputs.tag }}" \
            --notes-file release-notes.txt 2>&1); then
            echo "$out"
            echo "::error title=Rilis gagal::$(ls build/bin | tr '\n' ' ') -- $(echo "$out" | tr '\n' ' ')"
            exit 1
          fi
          echo "$out"
